name: cd

on:
    push:
        branches: [main]

jobs:
    Deploy:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v6

            
            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME}}
                password: ${{ secrets.DOCKERHUB_TOKEN}}
            
            - name: Build Image 
              run: |
                docker build -t eniolaomotee/bloggator:${{ github.sha }} .
            
            - name: Push Image to Registry
              run: |
                docker tag eniolaomotee/bloggator:${{ github.sha }} eniolaomotee/bloggator:latest
                docker push eniolaomotee/bloggator:${{ github.sha }}
