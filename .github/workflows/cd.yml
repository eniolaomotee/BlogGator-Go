name: cd

on:
    push:
        branches: [main]

jobs:
    Deploy:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v6
            
            # Authenticate with GCP
            - name: Authenticate to Google cloud
              uses: google-github-actions/auth@v1
              with:
                credentials_json: ${{ secrets.GCP_CREDENTIALS }}

            # Set up gcloud SDK
            - name: Set up cloud SDK
              uses: google-github-actions/setup-gcloud@v2
            
            # Setu up Go
            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: "1.25.5"
            

            # Install goose
            - name: Install goose
              run: go install github.com/pressly/goose/v3/cmd/goose@latest

            # Build and push image (first so we don't migrate if build fails) using Cloud Build
            - name: Build and push image
              run: |
                gcloud builds submit \
                  --tag us-central1-docker.pkg.dev/abstract-arbor-486909-f5/bloggator-repo/api-service:${{ github.sha }} \
                  .

            # Start Cloud SQL auth proxy
            - name: Start Cloud SQL Auth Proxy
              run: |
                curl -o cloud-sql-proxy -L https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.12.0/cloud-sql-proxy.linux.amd64
                chmod +x cloud-sql-proxy
                ./cloud-sql-proxy ${{ secrets.CLOUDSQL_INSTANCE }} --port 5432 &
                sleep 2

            # Run database migrations
            - name: Run database migrations
              env:
                DATABASE_URL: postgres://${{ secrets.DATABASE_USER }}:${{ secrets.DATABASE_PASSWORD }}@${{ secrets.DATABASE_HOST }}:${{ secrets.DATABASE_PORT }}/${{ secrets.DATABASE_NAME }}?sslmode=disable
              run: bash ./scripts/migrateup.sh

            # Deploy to Cloud Run
            - name: Deploy to Cloud Run
              run: |
                gcloud run deploy api-service \
                --image us-central1-docker.pkg.dev/abstract-arbor-486909-f5/bloggator-repo/api-service:${{ github.sha }} \
                --region us-central1 \
                --platform managed \
                --allow-unauthenticated \
                --set-env-vars "DB_URL=${{ secrets.DB_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }}" \
                --quiet
